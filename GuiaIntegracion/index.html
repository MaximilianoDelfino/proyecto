<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso de Personajes</title>
    <style>
        .oculta{
            display:none;
        }
        .pantalla{
            padding: 20px;
        }
        .divida{
            display:flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .columna{
            width: 50%;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Multiverso de Personajes</h1>
    <div id="inicio" class="pantalla">
        <button id="btnReg">Registrase</button>
        <button id="btnIng">Ingresar</button>
    </div>
    <div id="registro" class="oculta">
        <h1>Registro</h1>

        <label for="nombreReg">¿Cómo quieres nombrarte?: </label>
        <input type="text" id="nombreReg" placeholder="tu nombre acá" autocomplete="off">
        <br>
        <label for="contraReg">Elige tu nueva contraseña: </label>
        <input type="password" id="contraReg" placeholder="****" autocomplete="off">
        <button id="btnRegistro">Registrarse</button>
    </div>
    <div id="ingreso" class="oculta">
        <h1>Ingrese sus datos</h1>
        <label for="nombreLog">Nombre: </label>
        <input type="text" id="nombreLog" placeholder="tu nombre acá" autocomplete="off">
        <br>
        <label for="contraLog">Contraseña: </label>
        <input type="password" id="contraLog" placeholder="****" autocomplete="off">
        <button id="btnIngreso">Ingreso</button>
    </div>
    <div id="pantallaSeleccion" class="pantalla oculta">
        <label for="selectAPI">¿Con qué APIs desea interactuar?</label>
        <select id="selectAPI">
            <option value="" disabled selected></option>
            <option value="1">Simpsons</option>
            <option value="2">Rick and Morty</option>
            <option value="3">Ambos</option>
        </select>
        <div id="galeria" class="divida oculta">
            <div id="columnaRick" class="colmumna oculta">
                <label for="buscadorRick">Busque su personaje de Rick and Morty (use ID)</label>
                <input type="number" id="buscadorRick"></input>
                <button id="btnRick">Enter</button>
                <p id="personajesRick"></p>
            </div>
            <div id="columnaSimpson" class="colmumna oculta">
                <label for="buscadorSimp">Busque su personaje de los Simpsons (use ID)</label>
                <input type="number" id="buscadorSimp"></input>
                <p id="personajesSimp"></p>
                <button id="btnSimp">Enter</button>
            </div>
        </div>
    </div>
    <script>
        const btnPantallaReg = document.getElementById('btnReg')
        const btnPantallaIng = document.getElementById('btnIng')

        const registro = document.getElementById('registro')
        const ingreso = document.getElementById('ingreso')
        const inicio = document.getElementById('inicio')
        const pantallaSeleccion = document.getElementById('pantallaSeleccion')
        const galeria = document.getElementById('galeria')

        const coluRick = document.getElementById('columnaRick')
        const coluSimp = document.getElementById('columnaSimpson')

        btnPantallaReg.addEventListener('click',() =>{
            registro.classList.remove('oculta');
            ingreso.classList.add('oculta');
        })
        btnPantallaIng.addEventListener('click',() =>{
            ingreso.classList.remove('oculta');
            registro.classList.add('oculta');
        })

        let registroCuentas = JSON.parse(localStorage.getItem("cuenta")) || [];

        let nombre = ""
        let contrasena = ""

        const introNom = document.getElementById("nombreLog")
        const introCon = document.getElementById("contraLog")
        const btnIng = document.getElementById("btnIngreso")
        const selApi = document.getElementById("selectAPI")

        const regNom = document.getElementById("nombreReg")
        const regCon = document.getElementById("contraReg")
        const btnReg = document.getElementById("btnRegistro")
        const btnRick = document.getElementById('btnRick');
        const btnSimp = document.getElementById('btnSimp');

        btnReg.addEventListener('click',() => {
            nombre = regNom.value;
            contrasena = regCon.value;
            try{
                let comprobar = registroCuentas.some(nomb => nomb.usuario === nombre);
                if (comprobar){
                    throw new Error("Ese nombre ya está registrado");
                }
                const nuevaCuenta ={
                    usuario: nombre,
                    contrasena: contrasena
                }
                registroCuentas.push(nuevaCuenta);
                localStorage.setItem('cuenta',JSON.stringify(registroCuentas));

                console.log("se ha registrado con éxito!");

                ingreso.classList.remove('oculta');
                registro.classList.add('oculta');
            }catch(error){
                console.error("Error: ",error.message);
            }
        })
        
        btnIng.addEventListener('click',() => {
            nombre = introNom.value;
            contrasena = introCon.value;
            try{
                let comprobar = registroCuentas.find(nomb => nomb.usuario === nombre);
                if (!comprobar){
                    throw new Error("Ese usuario no existe");
                }
                if (comprobar.contrasena !== contrasena){
                    throw new Error("Contraseña incorrecta");
                }

                console.log("se ha ingresado con éxito!");

                ingreso.classList.add('oculta');
                registro.classList.add('oculta');
                pantallaSeleccion.classList.remove('oculta');
                
            }catch(error){
                console.error("Error: ",error.message);
            }
        })

        selApi.addEventListener('change', async () =>{
            galeria.classList.remove('oculta');
            if (selApi.value === "1"){
                coluRick.classList.add('oculta');
                coluSimp.classList.remove('oculta');
            }
            if (selApi.value === "2"){
                coluSimp.classList.add('oculta');
                coluRick.classList.remove('oculta')
            } 
            if (selApi.value === "3"){
                coluSimp.classList.remove('oculta');
                coluRick.classList.remove('oculta')
            }})
        btnRick.addEventListener('click', async () => {
            try{
                let rickId = document.getElementById('buscadorRick').value
                if (rickId !== ""){
                const resRick = await fetch(`https://rickandmortyapi.com/api/character/${rickId}`);
                if (!resRick.ok){
                    throw new Error('API no respondió a tiempo o no se encontró personaje');
                }
                const dataRick = await resRick.json();
                document.getElementById('personajesRick').innerHTML += `<h2>${dataRick.name}</h2><br><br>
                <img src="${dataRick.image}">
                <h4>${dataRick.status}<h4>
                <h4>${dataRick.species}<h4>`;}
            }catch(error){
                console.error(error.message)
            }})
        btnSimp.addEventListener('click', async () => {
            try{
                let simpId = document.getElementById('buscadorSimp').value
                if (simpId !== ""){
                const resSimp = await fetch(`https://thesimpsonsapi.com/api/characters/${simpId}`);
                if (!resSimp.ok){
                    throw new Error('API no respondió a tiempo o no se encontró personaje');
                }
                const dataSimp = await resSimp.json();
                document.getElementById('personajesSimp').innerHTML += `<h2>${dataSimp.name}</h2><br><br>
                <img src="https://cdn.thesimpsonsapi.com/200${dataSimp.portrait_path}">
                <h4>${dataSimp.gender}<h4>
                <h4>${dataSimp.occupation}<h4>`;} 
            }catch(error){
                console.error(error.message)
            }
        });

         
    </script>
</body>
</html>
