<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Batalla Pokémon</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f6f8fa; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .poke-card {
            border: 2px solid #e1e4e8;
            border-radius: 12px;
            background-color: white;
            transition: transform 0.2s; 
        }
        .poke-card:hover {
            transform: translateY(-5px); 
        }

        img {
            width: 150px;
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        
        <h1 class="text-center mb-5" style="color: #ef5350; font-weight: 800;">SIMULADOR DE BATALLA</h1>

        <div class="row justify-content-center align-items-center text-center">
            
            <div class="col-md-4">
                <div class="poke-card shadow-sm p-4">
                    <div id="pokemon1" class="mb-3"></div>
                    
                    <div id="restantes1" class="badge bg-secondary fs-6 w-100 mb-3 p-2">Pokemones restantes: 6</div>
                    
                    <button id="btn1" class="btn btn-danger w-100 fw-bold py-2">ATACAR</button>
                </div>
            </div>

            <div class="col-md-2 my-4 my-md-0">
                <h2 class="text-muted fw-bold">VS</h2>
            </div>

            <div class="col-md-4">
                <div class="poke-card shadow-sm p-4">
                    <div id="pokemon2" class="mb-3"></div>
                    
                    <div id="restantes2" class="badge bg-secondary fs-6 w-100 mb-3 p-2">Pokemones restantes: 6</div>
                    
                    <button id="btn2" class="btn btn-danger w-100 fw-bold py-2" disabled>ATACAR</button>
                </div>
            </div>
        </div>

        <div class="row mt-5 text-center">
            <div class="col-12">
                <div id="mensajeDerrotado1" class="fs-4 fw-bold text-dark"></div>
                <div id="mensajeDerrotado2" class="fs-4 fw-bold text-dark"></div>
            </div>
        </div>

    </div>
        <script src="js/fn.js"></script>    
    </body>
</html>
